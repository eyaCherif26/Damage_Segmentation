[project]
name = "mvp-clean"
version = "0.1.0"
description = "Multi-label infrastructure damage semantic segmentation MVP"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=5.0",
    "segmentation-models-pytorch>=0.5",
    "timm>=1.0",
    "albumentations>=2.0",
    "opencv-python>=4.9",
    "pycocotools>=2.0.11",
    "scikit-image>=0.24",
    "scipy",
    "wandb>=0.18",
    "pyyaml>=6.0",
    "numpy",
    "pandas",
    "matplotlib",
    "tqdm",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[tool.setuptools]
py-modules = []
