# ImageNet-pretrained encoder (init_mode: from_scratch) fine-tuned at NATIVE resolution: no whole-image squeeze.
# native_crop: images are scaled by pixel_scale (1.0 = native pixels) and the network sees 512px windows; train = random
# crops (70% centred on a labelled object, scale jitter +-25%), val = fixed crops, test/evaluate = full tile grid.
# Lower pixel_scale (0.5, 0.35...) trades detail for scene context. One epoch = one crop per image; raise
# data.train_crops_per_image to see more of each large photo per epoch (epoch time scales with it).
name: mobilenet_native
seed: 42
data:
  sources:
  - cif_coco
  - dacl10k
  dataset_config_paths:
    cif_coco: configs/data/datasets/cif_coco.yaml
    dacl10k: configs/data/datasets/dacl10k.yaml
  mvp_classes:
  - Cracks
  - Wetspot
  - Spalling
  - Rust
  - Efflorescence
  image_size: 512
  dacl10k_test_strategy: carve_val_from_train
  dacl10k_val_fraction: 0.1
  split_seed: 42
  batch_size: 8
  num_workers: 4
  resize_mode: native_crop
  pixel_scale: 1.0
  train_scale_jitter: 0.25
  fg_crop_prob: 0.7
  train_crops_per_image: 1
  val_crops_per_image: 1
model:
  name: smp_mobilenet
  encoder_name: mobilenet
  decoder: fpn
  init_mode: from_scratch
  dropout: 0.2
  num_classes: 5
  thin_structure_classes:
  - Cracks
loss:
  focal_weight: 1.0
  dice_weight: 1.0
  boundary_weight: 0.0
  dice_variant: tversky
  default_alpha: 0.25
  default_gamma: 2.0
  tversky_alpha: 0.3
  tversky_beta: 0.7
  per_class_alpha:
    Cracks: 0.35
  per_class_gamma:
    Cracks: 2.5
training:
  max_epochs: 30
  warmup_epochs: 2
  lr_head: 0.001
  lr_backbone: 0.0001
  weight_decay: 0.01
  frozen_epochs: 2
  early_stopping_patience: 5
  early_stopping_min_delta: 0.0001
  early_stopping_metric: val_macro_dice
  device: cuda
  amp: true
  grad_accum_steps: 1
  checkpoint_dir: runs
augmentation:
  horizontal_flip_p: 0.5
  vertical_flip_p: 0.5
  rotate90_p: 0.5
  shift_scale_rotate_p: 0.5
  shift_limit: 0.05
  scale_limit: 0.1
  rotate_limit: 15
  blur_p: 0.3
  blur_sigma_min: 0.4
  blur_sigma_max: 2.5
  color_jitter_p: 0.5
  brightness_limit: 0.2
  contrast_limit: 0.2
  hue_shift_limit: 5
wandb:
  entity: eya-cherif14
  project: damage_detection
  mode: online
  log_images_every_n_epochs: 5
  num_logged_images: 8
