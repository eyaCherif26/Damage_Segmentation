# SegFormer MiT-b0, from_scratch (ImageNet-pretrained encoder; task_pretrained is not available for
# SegFormer — see CLAUDE.md), cif_coco ONLY, whole-image resize to 512x512. Parallel to
# mobilenet_cif_512.yaml for a same-conditions backbone comparison. data.sources currently resolves
# to cif_coco's full un-subsetted train file (configs/data/datasets/cif_coco.yaml ->
# annotations_all_ori.json, ~105k tiles), not the smaller class-balanced annotations.json.
# lr_head is 0.0005 here (not 0.0006 like every other SegFormer config): this backbone's decode
# head is genuinely random-init in from_scratch mode (unlike task_pretrained, which loads a real
# dacl10k-trained decode head) — this scoped, deliberate choice does NOT touch baseline_segformer.yaml
# / segformer_native.yaml / segformer_task_pretrained*.yaml. See CLAUDE.md, 2026-09-29.
name: segformer_cif_512
seed: 42
data:
  sources:
  - cif_coco
  dataset_config_paths:
    cif_coco: configs/data/datasets/cif_coco.yaml
  mvp_classes:
  - Cracks
  - Wetspot
  - Spalling
  - Rust
  - Efflorescence
  image_size: 512
  dacl10k_test_strategy: carve_val_from_train
  dacl10k_val_fraction: 0.1
  split_seed: 42
  batch_size: 8
  num_workers: 4
model:
  name: segformer
  encoder_name: nvidia/mit-b0
  init_mode: from_scratch
  dropout: 0.2
  num_classes: 5
  thin_structure_classes:
  - Cracks
loss:
  focal_weight: 1.0
  dice_weight: 1.0
  boundary_weight: 0.0
  dice_variant: tversky
  default_alpha: 0.25
  default_gamma: 2.0
  tversky_alpha: 0.3
  tversky_beta: 0.7
  per_class_alpha:
    Cracks: 0.35
  per_class_gamma:
    Cracks: 2.5
training:
  max_epochs: 30
  warmup_epochs: 2
  lr_head: 0.0005
  lr_backbone: 6.0e-05
  weight_decay: 0.01
  grad_clip_max_norm: 1.0
  frozen_epochs: 2
  early_stopping_patience: 5
  early_stopping_min_delta: 0.0001
  early_stopping_metric: val_macro_dice
  device: cuda
  amp: true
  grad_accum_steps: 1
  checkpoint_dir: runs
augmentation:
  horizontal_flip_p: 0.5
  vertical_flip_p: 0.5
  rotate90_p: 0.5
  shift_scale_rotate_p: 0.5
  shift_limit: 0.05
  scale_limit: 0.1
  rotate_limit: 15
  blur_p: 0.3
  blur_sigma_min: 0.4
  blur_sigma_max: 2.5
  color_jitter_p: 0.5
  brightness_limit: 0.2
  contrast_limit: 0.2
  hue_shift_limit: 5
wandb:
  entity: eya-cherif14
  project: damage_detection
  mode: online
  log_images_every_n_epochs: 5
  num_logged_images: 8
